name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.YAPPER_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Benchmark scorer tests
        run: python3 -m unittest discover -s tools/transcribe-bench -v

      - name: Sorter eval scorer tests
        run: python3 -m unittest discover -s tools/sorter-eval -v

      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.YAPPER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/yapper-release.jks"
          echo "YAPPER_KEYSTORE_PATH=$RUNNER_TEMP/yapper-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          YAPPER_KEYSTORE_PASSWORD: ${{ secrets.YAPPER_KEYSTORE_PASSWORD }}
          YAPPER_KEY_ALIAS: ${{ secrets.YAPPER_KEY_ALIAS }}
          YAPPER_KEY_PASSWORD: ${{ secrets.YAPPER_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed APK missing. Check the four YAPPER_* secrets."; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E 'SHA-256' | tee cert.txt
          echo "### Signed with release key" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat cert.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out && cp "$APK" "out/yapper-${GITHUB_RUN_NUMBER}.apk"

      - name: Build debug APK (no signing key yet)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::YAPPER_KEYSTORE_BASE64 secret not set. Building a debug APK; it will NOT install over the next build. See docs/setup-guide.md."
          ./gradlew --no-daemon assembleDebug
          mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk "out/yapper-${GITHUB_RUN_NUMBER}-debug.apk"

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/yapper-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: yapper-apk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  # On main, keep one rolling pre-release with the newest APK, so the phone has one fixed download page.
  publish-latest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yapper-apk-${{ github.run_number }}
          path: out
      - name: Update "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build #${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_NUMBER}."
