# Yapper hub on the VPS. Run from the repository root:
#   docker compose -f hub/deploy/docker-compose.yml up -d --build
# Secrets live in hub/deploy/.env (never committed). Copy env.example to .env first.
services:
  hub:
    build:
      context: ../..
      dockerfile: hub/Dockerfile
    container_name: yapper-hub
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # No published port: only cloudflared reaches it, over the compose network.
    mem_limit: 450m

  tunnel:
    # Cloudflare Tunnel: HTTPS for board.yasiraloufi.dev with no open port on the VPS.
    image: cloudflare/cloudflared:2026.10.7
    container_name: yapper-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - hub
