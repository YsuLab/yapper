# Plain Docker alternative to Dokploy (Dokploy is the normal way: see hub/README.md).
# Run from the repository root:  docker compose -f hub/deploy/docker-compose.yml up -d --build
# Then put a reverse proxy with HTTPS in front of 127.0.0.1:8080.
services:
  hub:
    build:
      context: ../..
      dockerfile: hub/Dockerfile
    container_name: yapper-hub
    restart: unless-stopped
    environment:
      - HUB_TOKENS=${HUB_TOKENS}
      - HUB_ZONE=Asia/Riyadh
    volumes:
      - /srv/yapper-hub:/data
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 450m
