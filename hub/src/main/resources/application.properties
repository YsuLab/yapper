# Yapper hub. Override with environment variables (HUB_DB, HUB_TOKENS, ...) in deploy/.env.
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.forward-headers-strategy=framework
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

hub.db=${HUB_DB:./data/hub.db}
# Comma-separated name=token pairs, one per device, e.g. phone=...,tablet=...
hub.tokens=${HUB_TOKENS:}
hub.zone=${HUB_ZONE:Asia/Riyadh}
hub.backup-dir=${HUB_BACKUP_DIR:./data/backups}
hub.backup-keep=${HUB_BACKUP_KEEP:14}
hub.archive-after-days=${HUB_ARCHIVE_AFTER_DAYS:30}
# The board inside the Yapper app calls the API from this origin.
hub.cors-origins=${HUB_CORS_ORIGINS:https://appassets.androidplatform.net}

spring.datasource.url=jdbc:sqlite:${hub.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite has one writer. One pooled connection = no "database is locked".
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
spring.sql.init.mode=always

# Static board: HTML is always revalidated, so a new deploy shows at once.
spring.web.resources.cache.cachecontrol.no-cache=true
logging.level.root=WARN
logging.level.com.ysulab=INFO
server.error.include-message=always
